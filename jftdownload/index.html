<!DOCTYPE html>
<html lang="en">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SelfHelp NA Just For Today</title>
    <style>
        :root {
            --apple-color: #000000;
            --google-play-color: #3ddc84;
            --bg-color: #f8f9fa;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: var(--bg-color);
            text-align: center;
        }
        .container {
            background: white;
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            max-width: 450px;
            width: 90%;
            display: none; /* Hidden by default, shown by script for PC */
        }
        h1 {
            color: #1d1d1f;
            margin-bottom: 0.5rem;
            font-size: 1.8rem;
        }
        p {
            color: #86868b;
            margin-bottom: 2rem;
        }
        .qr-section {
            margin-bottom: 2rem;
        }
        .qr-image {
            width: 180px;
            height: 180px;
            padding: 10px;
            border: 1px solid #eee;
            border-radius: 12px;
        }
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 14px 24px;
            border-radius: 10px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
            gap: 10px;
            font-size: 1rem;
        }
        .btn svg {
            width: 20px;
            height: 20px;
        }
        .btn.apple {
            background-color: var(--apple-color);
            color: white;
        }
        .btn.apple:hover {
            background-color: #222;
            transform: translateY(-1px);
        }
        .btn.android {
            background-color: white;
            color: #5f6368;
            border: 1px solid #dadce0;
        }
        .btn.android:hover {
            background-color: #f1f3f4;
            transform: translateY(-1px);
        }
        .scan-text {
            font-size: 0.9rem;
            margin-top: 1rem;
            color: #6e6e73;
        }
    </style>
    <script>
        function redirect() {
            var userAgent = navigator.userAgent || navigator.vendor || window.opera;

            // iOS detection
            if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
                window.location.href = "https://apps.apple.com/us/app/id6759349113";
                return;
            }

            // Android detection
            if (/android/i.test(userAgent)) {
                // Try deep link first, then fallback to URL
                var playUrl = "https://play.google.com/store/apps/developer?id=Miranda+Devs";
                window.location.href = "market://search?q=pub:Miranda+Devs";
                
                // Fallback in case market:// doesn't trigger or user is in a browser that doesn't handle it
                setTimeout(function() {
                    window.location.href = playUrl;
                }, 500);
                return;
            }

            // If none of the above (PC/Other), show the landing page
            document.querySelector('.container').style.display = 'block';
        }

        window.onload = redirect;
    </script>
</head>
<body>
    <div class="container">
        <h1>Just For Today</h1>
        <p>Choose your platform to continue</p>
        
        <div class="qr-section">
            <img src="qr.png" alt="Scan QR Code" class="qr-image">
            <div class="scan-text">Scan code with your phone</div>
        </div>

        <div class="button-group">
            <a href="https://apps.apple.com/us/app/id6759349113" class="btn apple">

                App Store NA
            </a>
            <a href="https://play.google.com/store/apps/developer?id=Miranda+Devs" class="btn android">
                <svg viewBox="0 0 512 512" fill="currentColor"><path d="M325.3 234.3L104.6 13l280.8 161.2-60.1 60.1zM47 0C34 6.8 25.3 19.2 25.3 35.3v441.3c0 16.1 8.7 28.5 21.7 35.3l256.6-256L47 0zm425.2 225.6l-58.9-34.1-65.7 64.5 65.7 64.5 60.1-34.1c18-10.3 18-28.5-1.2-40.8zM325.3 277.7l60.1 60.1L104.6 499l220.7-221.3z"/></svg>
                Google Play NA AA
            </a>
        </div>
    </div>
</body>
</html>
